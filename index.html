<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2554eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LinguaMaster" />
    <meta name="description" content="A1'den C2'ye rehberli İngilizce dersleri, telaffuz, günlük konuşma kalıpları ve aralıklı tekrar sistemi. Tamamen ücretsiz." />
    <link rel="icon" type="image/svg+xml" href="/public/icon.svg" />
    <link rel="manifest" href="/public/manifest.json" />
    <link rel="apple-touch-icon" href="/public/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Tema: sayfa çizilmeden önce uygula (beyaz yanıp sönmeyi engeller)
      (function () {
        try {
          var raw = localStorage.getItem('linguamaster_v5');
          var theme = raw ? (JSON.parse(raw).settings || {}).theme : 'system';
          var dark = theme === 'dark' || ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
              display: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif']
            },
            colors: {
              brand: {
                50: '#eef4ff', 100: '#dbe6fe', 200: '#bfd3fe', 300: '#93b4fd', 400: '#6090fa',
                500: '#3b6ef6', 600: '#2554eb', 700: '#1d40d8', 800: '#1e35af', 900: '#1e328a', 950: '#172154'
              },
              ink: { 950: '#0a0f1c', 900: '#0f1629', 850: '#141c33' }
            },
            boxShadow: {
              soft: '0 1px 2px rgba(15,23,42,.04), 0 2px 8px -2px rgba(15,23,42,.06)',
              lift: '0 4px 6px -2px rgba(15,23,42,.05), 0 12px 24px -6px rgba(15,23,42,.10)'
            }
          }
        }
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        html { -webkit-tap-highlight-color: transparent; }
        body { @apply bg-slate-50 text-slate-900 dark:bg-ink-950 dark:text-slate-100 antialiased; font-feature-settings: 'cv11', 'ss01'; }
        ::selection { @apply bg-brand-600 text-white; }
        button { -webkit-user-select: none; user-select: none; }
      }
      @layer components {
        .card { @apply bg-white dark:bg-ink-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl shadow-soft; }
        .card-hover { @apply transition duration-150 hover:shadow-lift hover:border-slate-300 dark:hover:border-slate-700 cursor-pointer; }
        .btn { @apply inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition duration-150 active:scale-[.98] disabled:opacity-40 disabled:pointer-events-none whitespace-nowrap; }
        .btn-sm { @apply text-xs px-3 h-8; }
        .btn-md { @apply text-sm px-4 h-10; }
        .btn-lg { @apply text-[15px] px-6 h-12; }
        .btn-primary { @apply bg-brand-600 hover:bg-brand-700 text-white shadow-sm shadow-brand-600/20; }
        .btn-secondary { @apply bg-slate-100 hover:bg-slate-200 text-slate-800 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-100; }
        .btn-outline { @apply border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800; }
        .btn-ghost { @apply text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800; }
        .btn-success { @apply bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm shadow-emerald-600/20; }
        .btn-danger { @apply bg-rose-600 hover:bg-rose-700 text-white; }
        .icon-btn { @apply inline-flex items-center justify-center w-9 h-9 rounded-xl transition text-slate-500 dark:text-slate-400 hover:bg-slate-100 hover:text-slate-900 dark:hover:bg-slate-800 dark:hover:text-white active:scale-95; }
        .chip { @apply inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold leading-5; }
        .chip-brand { @apply bg-brand-50 text-brand-700 dark:bg-brand-950/70 dark:text-brand-300; }
        .chip-green { @apply bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300; }
        .chip-amber { @apply bg-amber-50 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300; }
        .chip-slate { @apply bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300; }
        .chip-rose { @apply bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300; }
        .eyebrow { @apply text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400; }
        .h1 { @apply font-display text-2xl sm:text-[28px] font-bold tracking-tight text-slate-900 dark:text-white; }
        .h2 { @apply font-display text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white; }
        .h3 { @apply font-semibold text-[15px] text-slate-900 dark:text-white; }
        .muted { @apply text-slate-500 dark:text-slate-400; }
        .divider { @apply border-t border-slate-100 dark:border-slate-800; }
        .progress { @apply h-2 w-full rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden; }
        .progress > span { @apply block h-full rounded-full bg-brand-600 transition-all duration-500; }
        .input { @apply w-full h-11 px-3.5 rounded-xl bg-white dark:bg-ink-900 border border-slate-300 dark:border-slate-700 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-4 focus:ring-brand-500/15 focus:border-brand-500; }
        .seg { @apply inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800/80 gap-1; }
        .seg-item { @apply px-3 h-8 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 transition hover:text-slate-900 dark:hover:text-white; }
        .seg-active { @apply bg-white dark:bg-ink-900 text-slate-900 dark:text-white shadow-sm; }
        .nav-item { @apply flex items-center gap-3 px-3 h-11 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-400 transition hover:bg-slate-100 hover:text-slate-900 dark:hover:bg-slate-800/70 dark:hover:text-white; }
        .nav-active { @apply bg-brand-50 text-brand-700 dark:bg-brand-950/60 dark:text-brand-300 hover:bg-brand-50 hover:text-brand-700 dark:hover:bg-brand-950/60; }
        .option { @apply w-full text-left px-4 py-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-ink-900 font-medium text-[15px] transition hover:border-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 flex items-center gap-3; }
        .option-key { @apply w-7 h-7 shrink-0 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-400 flex items-center justify-center; }
        .option-selected { @apply border-brand-500 bg-brand-50 dark:bg-brand-950/40 hover:bg-brand-50 hover:border-brand-500; }
        .option-correct { @apply border-emerald-500 bg-emerald-50 text-emerald-900 dark:bg-emerald-950/40 dark:text-emerald-100 hover:bg-emerald-50; }
        .option-wrong { @apply border-rose-500 bg-rose-50 text-rose-900 dark:bg-rose-950/40 dark:text-rose-100 hover:bg-rose-50; }
        .tile { @apply px-3.5 py-2 rounded-xl border-2 border-b-4 border-slate-200 dark:border-slate-700 bg-white dark:bg-ink-900 font-semibold text-[15px] transition active:translate-y-px hover:bg-slate-50 dark:hover:bg-slate-800; }
        .tile-used { @apply opacity-0 pointer-events-none; }
        .speak-btn { @apply inline-flex items-center justify-center w-9 h-9 rounded-full bg-brand-50 text-brand-700 hover:bg-brand-100 dark:bg-brand-950/70 dark:text-brand-300 dark:hover:bg-brand-900 transition active:scale-95; }
        .speak-btn-sm { @apply w-8 h-8; }
        .kbd { @apply inline-flex items-center px-1.5 h-5 rounded border border-slate-300 dark:border-slate-700 text-[10px] font-semibold text-slate-500; }
        .data-table th { @apply px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 whitespace-pre-line align-bottom; }
        .data-table td { @apply px-4 py-3 text-sm border-b border-slate-100 dark:border-slate-800/80 whitespace-pre-line align-top text-slate-700 dark:text-slate-300; }
        .data-table td:first-child { @apply font-semibold text-slate-900 dark:text-white; }
        .data-table tr:last-child td { @apply border-b-0; }
        .data-table tbody tr { @apply transition hover:bg-slate-50/80 dark:hover:bg-slate-800/40; }
      }
      @layer utilities {
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
      }
    </style>
    <style>
      @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
      @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes ping2 { 0% { box-shadow: 0 0 0 0 rgba(37, 84, 235, .45); } 100% { box-shadow: 0 0 0 14px rgba(37, 84, 235, 0); } }
      @keyframes shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); } }
      @keyframes confetti { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
      .anim-in { animation: fadeUp .25s cubic-bezier(.16, 1, .3, 1) both; }
      .anim-pop { animation: pop .35s cubic-bezier(.16, 1, .3, 1) both; }
      .anim-sheet { animation: slideUp .25s cubic-bezier(.16, 1, .3, 1) both; }
      .anim-float { animation: floatY 3s ease-in-out infinite; }
      .anim-ping { animation: ping2 1.6s cubic-bezier(0, 0, .2, 1) infinite; }
      .anim-shake { animation: shake .4s both; }
      .confetti-piece { position: fixed; top: -12px; width: 8px; height: 14px; border-radius: 2px; z-index: 100; pointer-events: none; animation: confetti 2.4s cubic-bezier(.25, .46, .45, .94) forwards; }
      .modern-hero {
        background:
          radial-gradient(at 0% 0%, rgba(59, 110, 246, 0.24) 0px, transparent 55%),
          radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.16) 0px, transparent 50%),
          linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
      }
      .modern-card {
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px -4px rgba(15, 23, 42, 0.06);
      }
      .animate-fadeIn { animation: fadeUp .25s cubic-bezier(.16, 1, .3, 1) both; }
      .animate-float { animation: floatY 3s ease-in-out infinite; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Inter, sans-serif; color: #64748b; }
    </style>
    <title>LinguaMaster — İngilizce Öğren</title>
  </head>
  <body>
    <div id="boot">Yükleniyor…</div>
    <div id="root"></div>
    <div id="toasts" class="fixed z-[90] top-4 inset-x-0 flex flex-col items-center gap-2 pointer-events-none px-4"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
